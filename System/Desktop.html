<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./Styles/Desktop.css">
    <script defer src="./Scripts/Desktop.js"></script>
    <title>T-CodeSystem</title>
</head>
<body>
    <h1 id="background-text">T-CodeSystem</h1>
    <div id="taskbar">
        <div id="launchpad-btn">
            <img src="../Images/logo.png" onerror="this.style.display='none'">
        </div>
    </div>
    <div id="launchpad">
        <div id="launchpad-browser" class="launchpad-program" onclick="startProgram('browser')">
            <img src="../Images/Browser.png" class="launchpad-program-image">
            <p class="launchpad-program-text">浏览器</p>
        </div>
        <div id="shutdown" onclick="shutdown()">关机</div>
        <div id="restart" onclick="restart()">重启</div>
    </div> 
    <div id="mouse"></div>
    <div id="menu">
        <div class="menu-item" id="github-link">在GitHub查看</div>
        <div class="menu-item" onclick="showOrHiddenMouse();hiddenMenu()">隐藏或显示鼠标球</div>
        <div class="menu-item" onclick="window.location.reload();hiddenMenu()">刷新</div>
    </div>
    <div class="window" id="browser">
        <div class="window-close" onclick="closeWindow('browser')">
            <span>×</span>
        </div>
        <div class="window-max" onclick="maxWindow('browser')">
            <span>▢</span>
        </div>
    </div>
</body>
</html>
